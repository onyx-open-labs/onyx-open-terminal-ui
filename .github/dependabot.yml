version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/Onyx.OpenTerminal.WinUI
      - /tests/Onyx.OpenTerminal.WinUI.Tests
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
