name: test
on:
  pull_request:
    branches: [test]
    types: [closed]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Validate signing failure guards
        run: ./tests/ReleasePipeline/test-signatures.ps1
      - name: Validate release preparation and failure guards
        run: ./tests/ReleasePipeline/test-publish-test.ps1
      - run: dotnet restore Onyx.OpenTerminal.sln
      - run: dotnet build Onyx.OpenTerminal.sln -c Release --no-restore
      - run: dotnet test Onyx.OpenTerminal.sln -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          retention-days: 90
          if-no-files-found: ignore
  package:
    needs: validate
    permissions:
      contents: read
      actions: read
    env:
      SIGNING_CERTIFICATE_SUBJECT: ${{ vars.SIGNING_CERTIFICATE_SUBJECT }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Require signing configuration
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          foreach ($name in @('SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG','SIGNING_CERTIFICATE_SUBJECT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing $name. Complete deploy/CODE-SIGNING.md; unsigned releases are blocked." }
          }
      - name: Install installer compiler
        run: |
          ./build/install-compiler.ps1 -Destination "$env:RUNNER_TEMP/inno"
      - name: Publish application for signing
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          PREVIOUS_TEST_COMMIT: ${{ github.event.pull_request.base.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./build/package-test.ps1 -Phase Publish -Architecture '${{ matrix.architecture }}' -BuildNumber $env:GITHUB_RUN_NUMBER -Attempt $env:GITHUB_RUN_ATTEMPT -Commit $env:SOURCE_COMMIT -PreviousTestCommit $env:PREVIOUS_TEST_COMMIT -RunUrl $env:RUN_URL -CompilerPath "$env:RUNNER_TEMP/inno/ISCC.exe"
      - name: Upload unsigned application
        id: unsigned-application
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-application-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish-${{ matrix.architecture }}/Onyx.OpenTerminal.WinUI.*
          retention-days: 1
          if-no-files-found: error
      - name: Sign application
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: application
          github-artifact-id: ${{ steps.unsigned-application.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/publish-${{ matrix.architecture }}
      - name: Package signed application
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          PREVIOUS_TEST_COMMIT: ${{ github.event.pull_request.base.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./build/package-test.ps1 -Phase Package -Architecture '${{ matrix.architecture }}' -BuildNumber $env:GITHUB_RUN_NUMBER -Attempt $env:GITHUB_RUN_ATTEMPT -Commit $env:SOURCE_COMMIT -PreviousTestCommit $env:PREVIOUS_TEST_COMMIT -RunUrl $env:RUN_URL -CompilerPath "$env:RUNNER_TEMP/inno/ISCC.exe"
      - name: Upload unsigned installer
        id: unsigned-installer
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-installer-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-${{ matrix.architecture }}/*-setup.exe
          retention-days: 1
          if-no-files-found: error
      - name: Sign installer
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/test-${{ matrix.architecture }}
      - name: Verify signed installer
        run: |
          $installer = @(Get-ChildItem artifacts/test-${{ matrix.architecture }}/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one signed installer.' }
          ./build/verify-signatures.ps1 -Path $installer[0].FullName -EvidencePath artifacts/test-${{ matrix.architecture }}/installer-signatures.json
      - name: Upload candidate and tester handoff
        uses: actions/upload-artifact@v6
        with:
          name: test-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-${{ matrix.architecture }}/*
          retention-days: 90
          if-no-files-found: error
  smoke:
    name: Installer smoke test (${{ matrix.architecture }})
    env:
      SIGNING_CERTIFICATE_SUBJECT: ${{ vars.SIGNING_CERTIFICATE_SUBJECT }}
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v7
        with:
          name: test-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Install, launch, verify version and uninstall
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem candidate/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one candidate installer.' }
          ./build/test-installer.ps1 -InstallerPath $installer[0].FullName -ReleaseMetadataPath candidate/release.json -EvidenceDirectory artifacts/smoke-${{ matrix.architecture }}
      - name: Upload installer smoke evidence (including failures)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: installer-smoke-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/smoke-${{ matrix.architecture }}/
          retention-days: 90
          if-no-files-found: error
  release:
    name: Publish GitHub test pre-release
    needs: [validate, package, smoke]
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v7
        with:
          name: test-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-input/test-x64
      - uses: actions/download-artifact@v7
        with:
          name: test-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-input/test-x86
      - uses: actions/download-artifact@v7
        with:
          name: installer-smoke-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-input/smoke-x64
      - uses: actions/download-artifact@v7
        with:
          name: installer-smoke-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-input/smoke-x86
      - uses: actions/download-artifact@v7
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-input/unit-tests
      - name: Verify evidence and publish pre-release with installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./build/publish-test.ps1 -ArtifactDirectory artifacts/release-input -OutputDirectory artifacts/release-output -Commit $env:SOURCE_COMMIT -Repository $env:RELEASE_REPOSITORY -RunUrl $env:RUN_URL
      - name: Upload release preparation diagnostics
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-release-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-output/release-notes.md
            artifacts/release-output/release-plan.json
            artifacts/release-output/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: ignore

